name: JEV Brock validation
on:
  push:
    branches: ['jev-brock/verified-run-20260923']
    paths: ['.github/workflows/jev-brock-validation.yml', 'jev_brock/**']
permissions:
  contents: read
concurrency:
  group: jev-brock-validation
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Isolated dependency and input inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/brock-lab/reports"
          python -m venv "$RUNNER_TEMP/brock-venv"
          "$RUNNER_TEMP/brock-venv/bin/python" -I -m pip install pyboy==2.6.1 pillow pytest
          cd "$RUNNER_TEMP/brock-lab"
          "$RUNNER_TEMP/brock-venv/bin/python" -I - <<'PY'
          import importlib.metadata, json, os, pathlib, hashlib
          from pyboy import PyBoy
          import numpy
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          files = []
          for p in root.rglob('*'):
              if p.is_file() and p.suffix.lower() in ('.gb', '.gbc', '.state'):
                  b = p.read_bytes()
                  files.append({'path': str(p.relative_to(root)), 'bytes': len(b), 'sha256': hashlib.sha256(b).hexdigest()})
          report = {'status': 'PREFLIGHT_ONLY_NOT_A_GAME_SUCCESS', 'numpy_origin': numpy.__file__, 'pyboy_version': importlib.metadata.version('pyboy'), 'inputs': files, 'rom_present': any(x['path'].lower().endswith(('.gb', '.gbc')) for x in files)}
          pathlib.Path('reports/preflight.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - name: Retain diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brock-preflight
          path: ${{ runner.temp }}/brock-lab/reports/
          retention-days: 7
